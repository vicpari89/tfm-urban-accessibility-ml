name: Docs

# When a tag is pushed: download the raw data, build the dataset, run the notebooks and publish them in GitHub Pages.
# The executed notebooks are NOT saved in the repository (they are only in the site).
on:
  push:
    tags: ["*"]
  workflow_dispatch:  # also by hand from the Actions tab, to test it

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the project and the docs tools
        run: uv sync --all-groups
      - name: Download the raw data (restricted Zenodo record)
        run: uv run python scripts/download_raw.py
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      - name: Build the dataset (data/interim and data/processed)
        run: uv run python -m urban_accessibility_ml.dataset
      - name: Run the notebooks and build the site
        run: bash scripts/build_docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
